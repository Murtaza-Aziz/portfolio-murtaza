    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { background: #F4F1EA; color: #1A1814; margin: 0; min-height: 100%; }
      #root:empty { display: grid; place-items: center; min-height: 100vh; font-family: system-ui, sans-serif; }
      #root:empty::after { content: "Loading portfolio…"; font-size: 0.875rem; letter-spacing: 0.05em; opacity: 0.6; }
    </style>
    <!-- GitHub Pages SPA redirect (https://github.com/rafgraph/spa-github-pages) -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
